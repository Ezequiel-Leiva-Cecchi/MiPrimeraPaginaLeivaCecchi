<article class="movie-card"><a class="poster" href="{% url 'detalle_pelicula' pelicula.id %}">{% if pelicula.poster_url %}<img src="{{ pelicula.poster_url }}" alt="Póster de {{ pelicula.titulo }}" loading="lazy">{% else %}<span class="poster-placeholder">{{ pelicula.titulo|slice:':1' }}</span>{% endif %}<span class="poster-action">Ver detalle</span></a><div class="movie-meta"><div><h3><a href="{% url 'detalle_pelicula' pelicula.id %}">{{ pelicula.titulo }}</a></h3><p>{{ pelicula.anio }} · {{ pelicula.generos.first|default:'Cine' }}</p></div>{% if pelicula.puntuacion_media %}<span class="rating">★ {{ pelicula.puntuacion_media|floatformat:1 }}</span>{% endif %}</div></article>
